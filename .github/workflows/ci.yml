name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz" | tar -xz
          echo "$PWD/binaryen-version_122/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (npm 11+ with stage support)
        run: npm install -g npm@latest

      - name: Build WebAssembly package
        run: npm run build

      - name: Test package in Node.js
        run: |
          node -e '
            import("./pkg/typst_math_wasm.js").then(async ({ default: init, compile_to_svg }) => {
              const fs = await import("node:fs");
              const wasm = fs.readFileSync("./pkg/typst_math_wasm_bg.wasm");
              await init({ module_or_path: wasm });
              const svg = compile_to_svg("$ E = m c^2 $");
              if (!svg.includes("<svg")) throw new Error("Invalid SVG output");
              console.log("CI smoke test passed!");
            });
          '

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg/

      - name: Prepare GitHub Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -r pkg _site/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release (GitHub & npm stage)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (npm 11+ with stage support)
        run: npm install -g npm@latest

      - name: Pack release tarball
        run: npm pack

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            pkg/typst_math_wasm_bg.wasm
            pkg/typst_math_wasm.js
            pkg/typst_math_wasm.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage publish to npm
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm run stage:publish
          else
            echo "NPM_TOKEN secret is not configured; skipping npm stage publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
