name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz" | tar -xz
          echo "$PWD/binaryen-version_122/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build WebAssembly package
        run: npm run build

      - name: Test package in Node.js
        run: |
          node -e '
            import("./pkg/typst_math_wasm.js").then(async ({ default: init, compile_to_svg }) => {
              const fs = await import("node:fs");
              const wasm = fs.readFileSync("./pkg/typst_math_wasm_bg.wasm");
              await init({ module_or_path: wasm });
              const svg = compile_to_svg("$ E = m c^2 $");
              if (!svg.includes("<svg")) throw new Error("Invalid SVG output");
              console.log("CI smoke test passed!");
            });
          '

  publish:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
